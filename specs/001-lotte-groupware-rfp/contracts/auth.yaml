openapi: 3.0.0
info:
  title: Authentication API
  version: 1.0.0
  description: API for user authentication and session management.
paths:
  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT for session management.
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /auth/logout:
    post:
      summary: User Logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
  /auth/me:
    get:
      summary: Get Current User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        profileImageUrl:
          type: string
          format: uri
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
